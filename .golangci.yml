version: "2"

run:
  build-tags:
    - integration
    - e2e

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G115
  exclusions:
    presets:
      - std-error-handling
    rules:
      - linters: [gosec]
        text: G404
        path: internal/(adapter/postgres/retry|app/(pending_policy|relay))\.go
      - linters: [gosec]
        text: G101|G204
        path: _test\.go

formatters:
  enable:
    - gofmt
    - goimports
