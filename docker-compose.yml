name: jungle-wallet

x-app: &app
  build: .
  image: jungle-wallet:local
  command: ["serve"]
  env_file:
    - path: .env.example
    - path: .env
      required: false
  volumes:
    - aws-credentials:/aws:ro
  depends_on:
    migrate:
      condition: service_completed_successfully
    aws-init:
      condition: service_completed_successfully
    keycloak:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/wallet", "health"]
    interval: 5s
    timeout: 4s
    start_period: 10s
    retries: 12
  # Longer than SHUTDOWN_TIMEOUT so that the drain completes before SIGKILL.
  stop_grace_period: 40s
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60

  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs,sns,iam
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -Eq '\"sqs\": \"(available|running)\"'"]
      interval: 3s
      timeout: 3s
      retries: 40

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    profiles: ["tracing"]
    ports:
      - "16686:16686"
      - "4318:4318"

  aws-init:
    image: amazon/aws-cli:2.17.0
    entrypoint: ["/bin/bash", "/init/init-aws.sh"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
    volumes:
      - ./deploy/aws:/init:ro
      - aws-credentials:/credentials
    depends_on:
      localstack:
        condition: service_healthy

  migrate:
    build: .
    image: jungle-wallet:local
    command: ["migrate", "up"]
    environment:
      MIGRATIONS_DATABASE_URL: postgres://wallet_owner:wallet_owner@postgres:5432/wallet?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  app-1:
    <<: *app
    environment:
      INSTANCE_ID: app-1
    ports:
      - "8081:8080"
      - "9091:9090"

  app-2:
    <<: *app
    environment:
      INSTANCE_ID: app-2
    ports:
      - "8082:8080"
      - "9092:9090"

  app-3:
    <<: *app
    environment:
      INSTANCE_ID: app-3
    ports:
      - "8083:8080"
      - "9093:9090"

volumes:
  pgdata:
  aws-credentials:
